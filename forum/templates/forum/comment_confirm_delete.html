{% extends "base.html" %}

{% block title %}Delete Comment - Commute By Bike{% endblock %}

{% block content %}
<h1 class="mb-4">Delete Comment</h1>

<div class="card mb-3">
    <div class="card-body">
        <p>Are you sure you want to delete this comment?</p>
        <blockquote class="border-start ps-3 text-body-secondary">{{ object.content }}</blockquote>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'forum:thread' object.thread.pk %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
